model:
  default: claude-opus-4.7
mcp_servers:
  time:
    command: uvx
    args:
    - mcp-server-time
  filesystem:
    command: npx
    args:
    - -y
    - '@modelcontextprotocol/server-filesystem'
    - /tmp
    enabled: false
  workiq:
    command: npx
    args:
    - -y
    - '@microsoft/workiq@latest'
    - mcp
    timeout: 180
